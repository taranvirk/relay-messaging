upstream relay_api {
  zone relay_api 64k;
  least_conn;
  # A single transient reset must not quarantine both otherwise healthy APIs.
  # Individual failed requests still retry the other replica immediately.
  server backend:3000 max_fails=3 fail_timeout=5s;
  server backend-replica:3000 max_fails=3 fail_timeout=5s;
  keepalive 32;
  # Node's default HTTP idle timeout is 5s (+ a 1s buffer in Node 24).
  # Retire cached connections first instead of racing the server's close.
  keepalive_timeout 4s;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  proxy_connect_timeout 2s;
  # Preserve application 503 JSON during shared dependency outages. Marking
  # both live APIs failed for a shared Redis outage would hide it behind 502 HTML.
  proxy_next_upstream error timeout http_502 http_504;
  proxy_next_upstream_timeout 5s;
  proxy_next_upstream_tries 2;

  location = /healthz { access_log off; return 200 "ok\n"; add_header Content-Type text/plain; }
  location /api/ {
    proxy_pass http://relay_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location /socket.io/ {
    proxy_pass http://relay_api;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 75s;
  }
  location = /index.html { add_header Cache-Control "no-store" always; }
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }
  location / { try_files $uri $uri/ /index.html; }
}
