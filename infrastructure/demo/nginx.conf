upstream relay_api {
  zone relay_api 64k;
  least_conn;
  server backend:3000 max_fails=3 fail_timeout=5s;
  server backend-replica:3000 max_fails=3 fail_timeout=5s;
  keepalive 32;
  keepalive_timeout 4s;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  # Only the fixed, private Caddy gateway is allowed to assert the client IP.
  set_real_ip_from 172.30.90.10;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;
  proxy_connect_timeout 2s;
  proxy_next_upstream error timeout http_502 http_504;
  proxy_next_upstream_timeout 5s;
  proxy_next_upstream_tries 2;

  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }
  location = /index.html {
    add_header Cache-Control "no-store" always;
  }
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }
  location /api/ {
    proxy_pass http://relay_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
  }
  location /socket.io/ {
    proxy_pass http://relay_api;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 75s;
  }
  location / {
    try_files $uri $uri/ /index.html;
  }
}
